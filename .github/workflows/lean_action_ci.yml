name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and check axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Print axioms of the main theorems
        run: lake env lean Check.lean
